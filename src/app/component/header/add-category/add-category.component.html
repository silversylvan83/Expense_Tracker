<mat-card class="et-formcard">
    <mat-card-header>
      <mat-card-title><mat-icon>sell</mat-icon>Expense categories</mat-card-title>
      <mat-card-subtitle>Add or remove the tags you file expenses under</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content class="et-cat-loading" *ngIf="CategoryLoad && !isEdit">
      <div class="spinner-grow" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div class="spinner-grow" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div class="spinner-grow" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </mat-card-content>
    <mat-card-content *ngIf="!CategoryLoad && !isEdit">
      <mat-form-field appearance="outline" class="example-form-field">
        <mat-label>Available expense categories</mat-label>
        <mat-chip-grid #chipGrid aria-label="Enter New Category">
          <mat-chip-row *ngFor="let keyword of keywords">
            {{ keyword }}
          </mat-chip-row>
          <mat-chip-row
            *ngFor="let keyword of newKeywords"
            (removed)="removeKeyword(keyword)"
          >
            {{ keyword }}
            <button matChipRemove aria-label="'remove ' + keyword">
              <mat-icon>cancel</mat-icon>
            </button>
          </mat-chip-row>
        </mat-chip-grid>
        <input
          placeholder="Click enter to add..."
          [matChipInputFor]="chipGrid"
          (matChipInputTokenEnd)="add($event)"
        />
      </mat-form-field>
    </mat-card-content>
    <mat-card-content *ngIf="!CategoryLoad && isEdit">
      <mat-form-field appearance="outline" class="example-form-field">
        <mat-label>Available expense categories</mat-label>
        <mat-chip-grid #chipGrid aria-label="Enter New Category">
          <mat-chip-row
            *ngFor="let keyword of keywords"
            (removed)="removeKeywordEdit(keyword)"
          >
            {{ keyword }}
            <button matChipRemove aria-label="'remove ' + keyword">
              <mat-icon>cancel</mat-icon>
            </button>
          </mat-chip-row>
        </mat-chip-grid>
        <input
          placeholder="Click enter to add..."
          [matChipInputFor]="chipGrid"
          (matChipInputTokenEnd)="add($event)"
          [disabled]="isEdit"
        />
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions align="end">
      <div>
        <button mat-icon-button aria-label="edit" matTooltip="Edit Categories" [disabled]="isEdit" (click)="onEditCategories()">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
      <button *ngIf="!isEdit" mat-stroked-button (click)="onReset()">
        <mat-icon>autorenew</mat-icon>Reset
      </button>
      <button
        *ngIf="!isSaving && !isEdit"
        mat-raised-button
        color="primary"
        (click)="onSave()"
        [disabled]="newKeywords.length === 0"
      >
        <mat-icon>save</mat-icon> Save
      </button>
      <button
        *ngIf="isEdit && !isSaving"
        mat-raised-button
        color="primary"
        (click)="onSaveEditCategories()"
      >
         Save
      </button>
      <button *ngIf="isSaving" class="btn btn-success" type="button" disabled>
        <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
        Saving...
      </button>
    </mat-card-actions>
  </mat-card>
